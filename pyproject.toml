[project]
name = "tomorrow-desk-api"
version = "0.1.0"
description = "FastAPI backend for Tomorrow Desk"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "firebase-admin>=6.6,<8.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "ruff>=0.9,<1.0"
]

[tool.pytest.ini_options]
addopts = "-q -p no:asyncio"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

